openapi: 3.1.0
info:
  title: Command Scheduler API
  version: 1.1.0
  description: >-
    API REST/JSON local para cadastrar e controlar schedules de comandos e suas
    ocorrências. O daemon deve escutar somente em loopback; clientes locais não
    usam autenticação. Host deve ser localhost ou um IP numérico de loopback.
    Chamadas de navegador exigem origem HTTP com o mesmo host e porta do Host;
    destinos arbitrários retornam 403, mesmo quando resolvem para loopback.
security: []
servers:
  - url: http://127.0.0.1:4371/api/v1
    description: Endereço local padrão; a porta pode ser configurada.
tags:
  - name: Schedules
    description: Cadastro, configuração e controle de schedules.
  - name: Occurrences
    description: Consulta, cancelamento e retry de execuções individuais.
  - name: Operations
    description: Consultas globais para cockpit, agenda e histórico operacional.
paths:
  /overview:
    get:
      tags: [Operations]
      operationId: getOverview
      summary: Consultar agregados do cockpit
      description: Contagens de schedules por estado e execuções finais por finishedAt. Intervalos são RFC 3339 semiabertos [from,to), interpretados como instantes absolutos; a UI calcula os limites no calendário local.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Resumo operacional, incluindo o próximo schedule ativo.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Overview'}
        '400': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /agenda:
    get:
      tags: [Operations]
      operationId: getAgenda
      summary: Consultar agenda de schedules e execuções
      description: Retorna os próximos 500 horários de schedules ativos selecionados globalmente e até 500 execuções finalizadas mais recentes no intervalo, até 1000 itens no total em ordem cronológica. Limites from e to são obrigatórios e semiabertos; horários cron são calculados no fuso local do daemon.
      parameters:
        - name: from
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: to
          in: query
          required: true
          schema: {type: string, format: date-time}
      responses:
        '200':
          description: Instâncias ordenadas por horário e schedule.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Agenda'}
        '400': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /occurrences:
    get:
      tags: [Occurrences]
      operationId: listAllOccurrences
      summary: Consultar histórico global de execuções
      description: Página ordenada por createdAt; filtros from/to comparam finishedAt, ou createdAt enquanto a ocorrência ainda não finalizou. A lista omite stdout/stderr; use GET /occurrences/{occurrenceId} para obter detalhes e saídas. O histórico retido cobre até 90 dias.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/OccurrenceStatus'}
        - name: scheduleId
          in: query
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Página filtrada de ocorrências.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OccurrencePage'}
        '400': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /commands/test:
    post:
      tags: [Schedules]
      operationId: testCommand
      summary: Executar um comando de teste sem criar schedule
      description: >-
        Inicia program diretamente com args, injeta parameters em
        COMMAND_SCHEDULER_PARAMS_JSON e retorna stdout, stderr e código de saída.
        Esta operação executa o processo real, pode produzir efeitos no sistema,
        não cria schedule nem ocorrência no histórico, termina o processo após
        30 segundos para processo e drenagem das saídas, inclusive descendentes,
        e limita cada saída capturada a 1 MiB. Timeout encerra a árvore de processos
        e preserva a saída já capturada, marcando streams incompletos como truncados.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CommandTestRequest'}
            example:
              program: /usr/bin/python3
              args: ["-c", "print('Hello, world!')"]
              parameters: null
      responses:
        '200':
          description: Resultado do teste; erro ao iniciar também aparece em stderr.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandTestResult'}
        '400': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /schedules:
    get:
      tags: [Schedules]
      operationId: listSchedules
      summary: Listar schedules
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/ScheduleStatus'}
      responses:
        '200':
          description: Página de schedules, inclusive vazia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulePage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Schedules]
      operationId: createSchedule
      summary: Criar um schedule
      description: >-
        Idempotency-Key é opcional. Repetir chave e corpo retorna o recurso
        originalmente criado; reutilizar a chave com corpo diferente retorna 409.
        Novos horários únicos precisam estar no futuro no momento da criação.
        Replay idempotente continua válido depois de vencer o horário original.
        parameters aceita qualquer valor JSON com corpo serializado de até 64 KiB.
        program identifica o executável e cada item de args é um argumento separado;
        o daemon inicia o processo diretamente, sem interpretar uma linha de comando
        por shell. Não envie o comando inteiro em program.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleCreate'
            example:
              program: /usr/bin/python3
              args: ["/home/alex/job.py", "--daily"]
              timing:
                type: cron
                expression: "30 8 * * 1-5"
              missedPolicy: consolidate
              parameters:
                date: "2026-10-13"
                dryRun: false
      responses:
        '200':
          description: Repetição idempotente retorna o schedule já criado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Schedule'}
        '201':
          description: Schedule criado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Schedule'}
              examples:
                criado:
                  summary: Schedule recorrente criado
                  value:
                    id: 1a5fcb9e-b764-4f62-a7d1-2d37856afc41
                    program: /usr/bin/python3
                    args: ["/home/alex/job.py"]
                    timing: {type: cron, expression: "30 8 * * 1-5"}
                    parameters: {date: "2026-10-13"}
                    missedPolicy: consolidate
                    status: active
                    createdAt: "2026-10-13T10:00:00Z"
                    updatedAt: "2026-10-13T10:00:00Z"
        '400': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /schedules/{scheduleId}:
    parameters:
      - $ref: '#/components/parameters/ScheduleId'
    get:
      tags: [Schedules]
      operationId: getSchedule
      summary: Consultar schedule
      responses:
        '200':
          description: Schedule encontrado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Schedule'}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      tags: [Schedules]
      operationId: updateSchedule
      summary: Atualizar configuração do schedule
      description: Atualizações de configuração não alteram uma ocorrência já iniciada.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/ScheduleUpdate'}
      responses:
        '200':
          description: Schedule atualizado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Schedule'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /schedules/{scheduleId}/parameters:
    parameters:
      - $ref: '#/components/parameters/ScheduleId'
    put:
      tags: [Schedules]
      operationId: updateParameters
      summary: Substituir parâmetros do schedule
      description: >-
        O corpo é qualquer valor JSON (objeto, array, string, número, booleano ou
        null), limitado a 64 KiB serializados. Atualização inválida ou tardia não
        altera os parâmetros aceitos nem uma execução em andamento.
      requestBody:
        required: true
        content:
          application/json:
            schema: {}
            example: {"batch": 42}
      responses:
        '200':
          description: Parâmetros aceitos; occurrenceId só aparece se a atualização iniciou execução.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ParameterUpdateResult'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /schedules/{scheduleId}/pause:
    post:
      tags: [Schedules]
      operationId: pauseSchedule
      summary: Pausar schedule
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
      responses:
        '200': {$ref: '#/components/responses/ScheduleResponse'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /schedules/{scheduleId}/resume:
    post:
      tags: [Schedules]
      operationId: resumeSchedule
      summary: Retomar schedule
      description: Horários vencidos durante a pausa são tratados conforme missedPolicy configurada no schedule.
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
      responses:
        '200': {$ref: '#/components/responses/ScheduleResponse'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /schedules/{scheduleId}/cancel:
    post:
      tags: [Schedules]
      operationId: cancelSchedule
      summary: Cancelar schedule sem cancelar ocorrências em andamento
      description: Impede retries automáticos futuros e cancela retries ainda na fila na mesma transação. Execuções já iniciadas continuam.
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
      responses:
        '200': {$ref: '#/components/responses/ScheduleResponse'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /schedules/{scheduleId}/runs:
    post:
      tags: [Schedules]
      operationId: runScheduleNow
      summary: Criar uma ocorrência manual imediata
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
      responses:
        '202':
          description: Execução aceita; consulte a ocorrência para acompanhar conclusão.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Occurrence'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /schedules/{scheduleId}/occurrences:
    get:
      tags: [Occurrences]
      operationId: listOccurrences
      summary: Listar ocorrências do schedule
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/OccurrenceStatus'}
      responses:
        '200':
          description: Página de ocorrências, inclusive vazia.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OccurrencePage'}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /occurrences/{occurrenceId}:
    parameters:
      - $ref: '#/components/parameters/OccurrenceId'
    get:
      tags: [Occurrences]
      operationId: getOccurrence
      summary: Consultar estado, resultado e saídas
      responses:
        '200':
          description: Ocorrência encontrada. Saídas podem indicar truncamento.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Occurrence'}
              examples:
                consolidada:
                  summary: Ocorrência de recuperação consolidada
                  value:
                    id: 55ecab8f-05a3-45e6-b812-2cb9d0cefe71
                    scheduleId: 1a5fcb9e-b764-4f62-a7d1-2d37856afc41
                    status: succeeded
                    source: recovery
                    attempt: 1
                    createdAt: "2026-10-13T12:00:00Z"
                    startedAt: "2026-10-13T12:00:01Z"
                    finishedAt: "2026-10-13T12:00:02Z"
                    exitCode: 0
                    stdout: done
                    stderr: ""
                    stdoutTruncated: false
                    stderrTruncated: false
                    missedOccurrences:
                      count: 3
                      from: "2026-10-13T08:00:00-03:00"
                      through: "2026-10-13T10:00:00-03:00"
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /occurrences/{occurrenceId}/cancel:
    post:
      tags: [Occurrences]
      operationId: cancelOccurrence
      summary: Solicitar cancelamento da ocorrência ativa
      parameters:
        - $ref: '#/components/parameters/OccurrenceId'
      responses:
        '202':
          description: Pedido aceito; isso não confirma que o processo já parou.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Occurrence'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: Ocorrência não está ativa; estado atual é retornado no problema.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /occurrences/{occurrenceId}/retry:
    post:
      tags: [Occurrences]
      operationId: retryOccurrence
      summary: Repetir uma ocorrência com falha ou interrompida
      description: Uma ocorrência interrompida após reinício exige confirmInterrupted=true.
      parameters:
        - $ref: '#/components/parameters/OccurrenceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmInterrupted: {type: boolean, default: false}
              additionalProperties: false
      responses:
        '202':
          description: Nova tentativa aceita; resultado original permanece consultável.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Occurrence'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
components:
  parameters:
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      schema: {type: string, format: uuid}
    OccurrenceId:
      name: occurrenceId
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Chave por criação lógica; retida enquanto o schedule existir.
      schema: {type: string, minLength: 1, maxLength: 255}
    Limit:
      name: limit
      in: query
      description: Máximo de itens retornados nesta página.
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    Cursor:
      name: cursor
      in: query
      description: Cursor opaco baseado na chave de ordenação, retornado na página anterior. Pode refletir alterações concorrentes sem repetir itens já vistos.
      schema: {type: string}
    From:
      name: from
      in: query
      required: false
      description: Limite inferior RFC 3339 (inclusivo).
      schema: {type: string, format: date-time}
    To:
      name: to
      in: query
      required: false
      description: Limite superior RFC 3339 (exclusivo).
      schema: {type: string, format: date-time}
  responses:
    Problem:
      description: Erro conforme Problem Details (RFC 9457).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ScheduleResponse:
      description: Estado atual do schedule após a ação.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Schedule'}
  schemas:
    ScheduleCreate:
      type: object
      required: [program, args, timing, missedPolicy]
      properties:
        name: {type: string}
        program:
          type: string
          minLength: 1
          description: Executável a iniciar, não uma linha de comando completa. O daemon não usa shell implícito.
        args:
          type: array
          description: Argumentos individuais, na ordem em que serão passados ao executável.
          items: {type: string}
        timing: {$ref: '#/components/schemas/Timing'}
        parameters: {}
        missedPolicy: {$ref: '#/components/schemas/MissedPolicy'}
        parameterUpdateTrigger: {$ref: '#/components/schemas/ParameterUpdateTrigger'}
        retryPolicy: {$ref: '#/components/schemas/RetryPolicy'}
      additionalProperties: false
    CommandTestRequest:
      type: object
      required: [program]
      properties:
        program:
          type: string
          minLength: 1
          description: Executável a iniciar, não uma linha de comando completa; não usa shell implícito.
        args:
          type: array
          items: {type: string}
          default: []
        parameters: {}
      additionalProperties: false
    CommandTestResult:
      type: object
      required: [stdout, stderr, stdoutTruncated, stderrTruncated, timedOut]
      properties:
        exitCode: {type: [integer, 'null']}
        stdout: {type: string, maxLength: 1048576}
        stderr: {type: string, maxLength: 1048576}
        stdoutTruncated: {type: boolean}
        stderrTruncated: {type: boolean}
        timedOut: {type: boolean}
      additionalProperties: false
    ScheduleUpdate:
      type: object
      description: Mudança efetiva de timing reinicia o cursor no instante da alteração, sem recuperar horários anteriores. Edições de outros campos ou horários equivalentes preservam o cursor. A comparação e a alteração são transacionais.
      properties:
        name: {type: string}
        program:
          type: string
          minLength: 1
          description: Executável a iniciar, não uma linha de comando completa. O daemon não usa shell implícito.
        args:
          type: array
          description: Argumentos individuais, na ordem em que serão passados ao executável.
          items: {type: string}
        timing: {$ref: '#/components/schemas/Timing'}
        missedPolicy: {$ref: '#/components/schemas/MissedPolicy'}
        parameterUpdateTrigger: {$ref: '#/components/schemas/ParameterUpdateTrigger'}
        retryPolicy: {$ref: '#/components/schemas/RetryPolicy'}
      additionalProperties: false
      minProperties: 1
    Timing:
      oneOf:
        - type: object
          required: [type, at]
          properties:
            type: {const: once}
            at:
              type: string
              format: date-time
              description: Novas programações únicas, na criação ou em mudança efetiva por PATCH, devem ser posteriores ao instante atual. Reenvio idempotente permanece válido após esse horário.
          additionalProperties: false
        - type: object
          required: [type, expression]
          properties:
            type: {const: cron}
            expression:
              type: string
              description: Cron padrão de cinco campos (minuto hora dia-do-mês mês dia-da-semana), no fuso local da máquina; horário inexistente é pulado e horário repetido executa uma vez.
              pattern: '^\S+\s+\S+\s+\S+\s+\S+\s+\S+$'
              examples: ['30 8 * * 1-5', '0 0 1 * *']
          additionalProperties: false
      discriminator: {propertyName: type}
    MissedPolicy:
      type: string
      enum: [skip, consolidate, sequence]
      description: sequence mantém até 100 ocorrências individuais e consolida excedentes.
    ParameterUpdateTrigger:
      type: object
      required: [enabled, scheduleBehavior]
      properties:
        enabled: {type: boolean}
        scheduleBehavior:
          type: string
          enum: [replace, coexist]
          description: Se enabled, atualização inicia ocorrência manual e pode substituir ou coexistir com horário. Se omitido na criação, o gatilho fica desabilitado.
      additionalProperties: false
    RetryPolicy:
      type: object
      properties:
        maxRetries: {type: integer, minimum: 0, default: 3}
        delaysSeconds:
          type: array
          items: {type: integer, minimum: 1}
          default: [60, 300, 900]
          description: 'Três tentativas após a inicial por padrão: 1, 5 e 15 minutos.'
      additionalProperties: false
    Schedule:
      type: object
      required: [id, program, args, timing, missedPolicy, status, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        program: {type: string, minLength: 1}
        args: {type: array, items: {type: string}}
        timing: {$ref: '#/components/schemas/Timing'}
        parameters: {}
        missedPolicy: {$ref: '#/components/schemas/MissedPolicy'}
        parameterUpdateTrigger: {$ref: '#/components/schemas/ParameterUpdateTrigger'}
        retryPolicy: {$ref: '#/components/schemas/RetryPolicy'}
        status: {type: string, enum: [active, paused, cancelled]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    SchedulePage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Schedule'}}
        nextCursor: {type: [string, 'null']}
    ScheduleStatus:
      type: string
      enum: [active, paused, cancelled]
    Overview:
      type: object
      required: [schedules, completed, failed, next]
      properties:
        schedules:
          type: object
          required: [active, paused, cancelled]
          properties:
            active: {type: integer, minimum: 0}
            paused: {type: integer, minimum: 0}
            cancelled: {type: integer, minimum: 0}
        completed: {type: integer, minimum: 0, description: 'Ocorrências succeeded com finishedAt em [from,to).'}
        failed: {type: integer, minimum: 0, description: 'Ocorrências failed com finishedAt em [from,to), retries contados individualmente.'}
        next:
          oneOf:
            - {$ref: '#/components/schemas/NextSchedule'}
            - type: 'null'
    NextSchedule:
      type: object
      required: [scheduleId, program, at]
      properties:
        scheduleId: {type: string, format: uuid}
        name: {type: [string, 'null']}
        program: {type: string}
        at: {type: string, format: date-time}
    Agenda:
      type: object
      required: [items]
      properties:
        items: {type: array, maxItems: 1000, items: {$ref: '#/components/schemas/AgendaItem'}}
    AgendaItem:
      type: object
      required: [scheduleId, program, at]
      properties:
        scheduleId: {type: string, format: uuid}
        name: {type: [string, 'null']}
        program: {type: string}
        at: {type: string, format: date-time}
        occurrenceId: {type: [string, 'null'], format: uuid}
        status: {type: [string, 'null'], enum: [queued, running, succeeded, failed, cancelled, interrupted, null]}
    OccurrenceStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled, interrupted]
    Occurrence:
      type: object
      required: [id, scheduleId, status, source, createdAt, attempt]
      properties:
        id: {type: string, format: uuid}
        scheduleId: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/OccurrenceStatus'}
        source: {type: string, enum: [schedule, parameter_update, manual, retry, recovery]}
        attempt: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        scheduledFor: {type: [string, 'null'], format: date-time}
        startedAt: {type: [string, 'null'], format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
        exitCode: {type: [integer, 'null']}
        stdout: {type: string, maxLength: 1048576}
        stderr: {type: string, maxLength: 1048576}
        stdoutTruncated: {type: boolean}
        stderrTruncated: {type: boolean}
        missedOccurrences: {$ref: '#/components/schemas/MissedOccurrences'}
        retryOf: {type: [string, 'null'], format: uuid}
    OccurrencePage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Occurrence'}}
        nextCursor: {type: [string, 'null']}
    MissedOccurrences:
      type: object
      required: [count, from, through]
      properties:
        count: {type: integer, minimum: 1}
        from: {type: string, format: date-time}
        through: {type: string, format: date-time}
    ParameterUpdateResult:
      type: object
      required: [schedule]
      properties:
        schedule: {$ref: '#/components/schemas/Schedule'}
        occurrenceId: {type: string, format: uuid}
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        code:
          type: string
          description: Código estável para tratamento programático.
          examples: [validation_error, schedule_not_found, invalid_state, idempotency_conflict, parameters_too_large, interrupted_confirmation_required]
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: {type: string}
              message: {type: string}
      example:
        type: about:blank
        title: Conflict
        status: 409
        detail: A chave de idempotência já foi usada com outro conteúdo.
        code: idempotency_conflict
